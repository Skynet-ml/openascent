name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with the dev group
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check the format
        run: ruff format --check .
      - name: Run the tests
        # The runner has node, go, cargo and jq, so an example test must not
        # skip here: a missing tool fails the test instead.
        env:
          ASCENT_REQUIRE_TOOLCHAINS: "1"
        run: python -m pytest -q -rs
